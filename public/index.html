<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnonTalk IUB</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-glow"></div>

  <!-- AUTH CARD -->
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="logo-wrap">
        <h1 class="logo-text">AnonTalk</h1>
      </div>

      <p class="subtitle">Access only for IUB students</p>

      <input
        type="email"
        id="email-input"
        placeholder="student@iub.edu.bd"
        class="email-input"
      >

      <button class="primary-btn" onclick="login()">
        Enter Anonymously
      </button>

      <p class="meta">
        No password • No tracking • Anonymous
      </p>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
