<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID | IUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mesh-bg"></div>

    <div id="auth-view" class="view auth-overlay">
        <div class="glass-card auth-box">
            <h1 class="logo-text">VOID</h1>
            <p class="subtitle">Access restricted to IUB students</p>
            <div id="step-1">
                <input type="email" id="email" class="glossy-input" placeholder="student@iub.edu.bd">
                <button onclick="sendCode()" class="glossy-btn">Request Access</button>
            </div>
            <div id="step-2" style="display:none">
                <input type="text" id="code" class="glossy-input" placeholder="6-digit code">
                <button onclick="verifyCode()" class="glossy-btn">Verify Identity</button>
            </div>
        </div>
    </div>

    <div id="feed-view" class="view container" style="display:none">
        <div class="logo-header">VOID</div>
        
        <div class="glass-card compose-card">
            <textarea id="post-box" placeholder="What is the secret?" maxlength="500"></textarea>
            <div class="card-ft">
                <span id="char-count">0/500</span>
                <button onclick="createPost()" class="glossy-btn">Anonymize</button>
            </div>
        </div>

        <div id="notif-bar" class="glass-card notif-bar" style="display:none">
            <div class="nb-header">Recent Replies <span onclick="clearNotifs()">×</span></div>
            <div id="notif-list"></div>
        </div>

        <div class="tab-bar">
            <button class="t-btn active" onclick="setTab('new', this)">Latest</button>
            <button class="t-btn" onclick="setTab('hot', this)">Trending</button>
            <button class="t-btn" onclick="setTab('old', this)">Voided</button>
        </div>

        <div id="feed-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
