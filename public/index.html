<style>
    .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .filter-btn { 
        background: rgba(255,255,255,0.05); border: 1px solid #333; 
        color: #888; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
    }
    .filter-btn.active { background: var(--p); color: #000; border-color: var(--p); }
</style>

<div id="app" class="container" style="display:none">
    <div class="logo" style="font-size: 1.5rem; text-align: left;">AnonTalk</div>
    
    <div class="filter-bar">
        <div class="filter-btn active" onclick="setFilter('recent', this)">Recent</div>
        <div class="filter-btn" onclick="setFilter('hot', this)">Hot 🔥</div>
        <div class="filter-btn" onclick="setFilter('old', this)">Old (1h+)</div>
    </div>

    <div class="glass" style="padding: 20px;">
        <textarea id="msg" placeholder="Post anonymously..."></textarea>
        <button onclick="submitPost()">Post</button>
    </div>
    <div id="feed"></div>
</div>

<script>
    let currentFilter = 'recent';

    function setFilter(type, btn) {
        currentFilter = type;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        load();
    }

    async function load() {
        const res = await fetch(`/api/posts?filter=${currentFilter}`);
        const posts = await res.json();
        
        // 1. NOTIFY LOGIC
        // We only notify if the post author_id matches the user's uid
        const myUid = localStorage.getItem('v_uid');
        posts.forEach(p => {
            if (p.author_id === myUid) {
                const lastSeenCount = localStorage.getItem('notif_seen_' + p.id) || 0;
                if (p.replies.length > lastSeenCount) {
                    showNotif("Someone replied to your post!");
                    localStorage.setItem('notif_seen_' + p.id, p.replies.length);
                }
            }
        });

        renderFeed(posts);
    }

    function showNotif(text) {
        const n = document.getElementById('notif');
        n.innerText = text;
        n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 5000);
    }

    // 2. DELETE LOGIC (ADMIN)
    async function del(id) {
        const pw = prompt("Enter Admin Password:");
        if (!pw) return;
        const res = await fetch(`/api/posts/${id}`, {
            method: 'DELETE',
            headers: { 'adminpw': pw }
        });
        if (res.ok) {
            alert("Post removed.");
            load();
        } else {
            alert("Wrong Password.");
        }
    }

    // (Include the rest of the submitPost, like, and reply functions from before)
</script>
