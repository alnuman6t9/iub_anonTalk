<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inner Peace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ADMIN LOGIN -->
<div id="admin-login" class="overlay">
  <div class="card">
    <h2>Admin Login</h2>
    <input type="password" id="admin-pw" placeholder="Admin password" />
    <button onclick="loginAdmin()">Login</button>
  </div>
</div>

<div class="bg-glow"></div>

<div class="container">
  <h1 class="logo">Inner Peace</h1>
  <p class="tagline">We hear. We don’t judge. We suggest.</p>

  <div class="card">
    <textarea id="postBox" placeholder="Share your thoughts, problems, or questions freely..."></textarea>
    <button onclick="sendPost()">Share</button>
  </div>

  <div id="feed"></div>
</div>

<script src="script.js"></script>
</body>
</html>
