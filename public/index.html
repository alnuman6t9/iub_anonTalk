<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inner Peace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ADMIN LOGIN -->
<!-- LOGIN OVERLAY -->
<div id="login-overlay" class="overlay">
  <div class="card login-card">
    <h2>Welcome to Inner Peace</h2>
    <p class="tagline">We hear. We don’t judge. We suggest.</p>

    <!-- MEMBER LOGIN -->
    <div id="member-login">
      <input
        type="text"
        id="nickname"
        placeholder="Enter a nickname"
      />
      <button onclick="loginMember()">Continue</button>
    </div>

    <hr style="margin:20px 0; opacity:.2">

    <!-- ADMIN LOGIN -->
    <div id="admin-login">
      <input
        type="password"
        id="admin-pw"
        placeholder="Admin password"
      />
      <button onclick="loginAdmin()">Admin Login</button>
    </div>
  </div>
</div>

<div class="bg-glow"></div>

<div class="container">
  <h1 class="logo">Inner Peace</h1>
  <p class="tagline">We hear. We don’t judge. We suggest.</p>

  <div class="card">
    <textarea id="postBox" placeholder="Share your thoughts, problems, or questions freely..."></textarea>
    <button onclick="sendPost()">Share</button>
  </div>

  <div id="feed"></div>
</div>

<script src="script.js"></script>
</body>
</html>
