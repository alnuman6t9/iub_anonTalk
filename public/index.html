<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID | IUB Verified</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-overlay" class="auth-overlay">
        <div class="glass-card auth-box">
            <h2 class="logo">Verify IUB</h2>
            <div id="email-step">
                <input type="email" id="iub-email" placeholder="name@iub.edu.bd">
                <button onclick="sendCode()">Send Code</button>
            </div>
            <div id="code-step" style="display:none;">
                <input type="text" id="verify-code" placeholder="6-digit code">
                <button onclick="verifyCode()">Verify & Enter</button>
            </div>
        </div>
    </div>

    <div class="glow"></div>
    <div class="container">
        <div class="logo">AnonTalk</div>
        <div class="glass-card">
            <textarea id="box" placeholder="Share anonymously..." maxlength="500"></textarea>
            <div class="card-ft">
                <span id="chars">0/500</span>
                <button onclick="sendPost()">Post</button>
            </div>
        </div>
        <div id="notif-section" class="notif-container" style="display:none;">
            <div class="notif-header">Notifications <span class="clear-btn" onclick="clearNotifs()">Clear</span></div>
            <div id="notif-list"></div>
        </div>
        <div class="tabs">
            <button class="t-btn active" onclick="setTab('new', this)">New</button>
            <button class="t-btn" onclick="setTab('hot', this)">Hot</button>
            <button class="t-btn" onclick="setTab('old', this)">Old</button>
        </div>
        <div id="feed"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
