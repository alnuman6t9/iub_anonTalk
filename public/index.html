<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inner Peace – Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <!-- LEFT SIDE -->
  <div class="left">
    <div class="sun">☀️</div>
    <h1>Find Your<br><span>Inner Peace</span></h1>

    <blockquote>
      “The best way to cheer yourself is to try to cheer someone else up.”
    </blockquote>

    <p class="sub">
      Join a community where we hear, don’t judge, and suggest kindly.
    </p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <div class="card">
      <h2>Welcome</h2>
      <p class="muted">Enter your details to join the circle</p>

      <!-- TOGGLE -->
      <div class="toggle">
        <button id="memberBtn" class="active" onclick="setMode('member')">Member</button>
        <button id="adminBtn" onclick="setMode('admin')">Admin</button>
      </div>

      <!-- MEMBER LOGIN -->
      <div id="memberBox">
        <label>Nickname</label>
        <input type="text" id="nickname" placeholder="e.g. PeacefulPanda">
        <button class="primary" onclick="loginMember()">Enter with Peace</button>
      </div>

      <!-- ADMIN LOGIN -->
      <div id="adminBox" style="display:none">
        <label>Admin Password</label>
        <input type="password" id="adminPw" placeholder="Admin password">
        <button class="primary" onclick="loginAdmin()">Login as Admin</button>
      </div>

      <p class="footer">
        By entering, you agree to be kind and non-judgmental.
      </p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
